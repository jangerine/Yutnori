<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 윷놀이 (2~4인용)</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
    .card { background: white; max-width: 500px; margin: 0 auto 20px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, button { padding: 10px 15px; font-size: 16px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #board-canvas { background: #fdf8ec; border: 3px solid #8b5a2b; border-radius: 12px; margin: 10px 0; cursor: pointer; }
    #result-box { font-size: 20px; font-weight: bold; margin: 10px 0; color: #333; min-height: 30px; }
    .player-list { text-align: left; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; }
    .active-turn { font-weight: bold; color: #007bff; }
    #game-area { display: none; }
  </style>
</head>
<body>

  <div class="card" id="login-area">
    <h2>🎲 실시간 윷놀이</h2>
    <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="8"><br>
    <input type="text" id="room-id" placeholder="방 코드 입력"><br>
    <button onclick="joinRoom()">입장하기</button>
  </div>

  <div class="card" id="game-area">
    <h3 id="room-title">방 코드: </h3>
    
    <div class="player-list">
      <div>참여 인원 (<span id="player-count">0</span>/4)</div>
      <div id="players"></div>
    </div>

    <canvas id="board-canvas" width="360" height="440"></canvas>

    <div id="result-box">대기 중...</div>

    <div id="controls">
      <button id="start-btn" onclick="startGame()">게임 시작 (2인 이상)</button>
      <button id="throw-btn" onclick="throwYut()" style="display:none;">윷 던지기!</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = null;
    let currentLastResultSteps = 0;
    let canMoveToken = false;
    let playersData = [];
    let tokensData = {};

    const canvas = document.getElementById('board-canvas');
    const ctx = canvas.getContext('2d');

    // 정통 윷놀이 판 좌표 정의 (한 변에 모서리 포함 6개 점)
    const boardCoords = [
      {x: 0, y: 0}, // 0: 대기소
      
      // 오른쪽 아래(출발) -> 오른쪽 위 (1~5)
      {x: 340, y: 340}, {x: 340, y: 276}, {x: 340, y: 212}, {x: 340, y: 148}, {x: 340, y: 84}, {x: 340, y: 20},
      
      // 오른쪽 위 -> 왼쪽 위 (6~10)
      {x: 276, y: 20},  {x: 212, y: 20},  {x: 148, y: 20},  {x: 84, y: 20},   {x: 20, y: 20},
      
      // 왼쪽 위 -> 왼쪽 아래 (11~15)
      {x: 20, y: 84},   {x: 20, y: 148},  {x: 20, y: 212},  {x: 20, y: 276},  {x: 20, y: 340},
      
      // 왼쪽 아래 -> 오른쪽 아래 (16~19)
      {x: 84, y: 340},  {x: 148, y: 340}, {x: 212, y: 340}, {x: 276, y: 340},
      
      // 대각선 1 (오른쪽 위 -> 왼쪽 아래) (20~24)
      {x: 287, y: 73},  {x: 234, y: 126}, {x: 180, y: 180}, {x: 126, y: 234}, {x: 73, y: 287},
      
      // 대각선 2 (왼쪽 위 -> 오른쪽 아래) (25~28)
      {x: 73, y: 73},   {x: 126, y: 126}, {x: 234, y: 234}, {x: 287, y: 287}
    ];

    const playerColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f'];

    socket.on('connect', () => { myId = socket.id; });

    function joinRoom() {
      const nickname = document.getElementById('nickname').value.trim();
      const roomId = document.getElementById('room-id').value.trim();
      if (!roomId) return alert('방 코드를 입력하세요.');

      socket.emit('joinRoom', { roomId, nickname });
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      document.getElementById('room-title').innerText = `방 코드: ${roomId}`;
      drawBoard();
    }

    function startGame() { socket.emit('startGame'); }
    function throwYut() { socket.emit('throwYut'); }

    const yutStepMap = { '도': 1, '개': 2, '걸': 3, '윷': 4, '모': 5 };

    socket.on('roomState', ({ players, currentTurn, gameStarted, tokens }) => {
      playersData = players;
      tokensData = tokens;
      updateUI(players, currentTurn);
      drawBoard();
    });

    socket.on('gameStarted', ({ players, currentTurn, tokens }) => {
      playersData = players;
      tokensData = tokens;
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('throw-btn').style.display = 'inline-block';
      document.getElementById('result-box').innerText = '게임을 시작합니다!';
      updateUI(players, currentTurn);
      drawBoard();
    });

    socket.on('yutResult', ({ player, result }) => {
      document.getElementById('result-box').innerText = `${player.nickname}: [ ${result} ]! 말을 클릭하세요.`;
      currentLastResultSteps = yutStepMap[result];

      if (player.id === myId) {
        canMoveToken = true;
        document.getElementById('throw-btn').disabled = true;
      }
    });

    socket.on('tokenMoved', ({ tokens, nextTurn }) => {
      tokensData = tokens;
      canMoveToken = false;
      updateUI(playersData, nextTurn);
      drawBoard();
    });

    // 판 클릭 시 말 클릭 감지
    canvas.addEventListener('click', (e) => {
      if (!canMoveToken) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const myTokens = tokensData[myId] || [0, 0, 0, 0];

      for (let tIdx = 0; tIdx < myTokens.length; tIdx++) {
        const pos = myTokens[tIdx];
        let tokenPos = { x: 0, y: 0 };

        if (pos === 0) {
          tokenPos = { x: 50 + tIdx * 35, y: 412 };
        } else if (pos <= 28) {
          tokenPos = boardCoords[pos];
        } else {
          continue;
        }

        const dist = Math.hypot(mouseX - tokenPos.x, mouseY - tokenPos.y);
        if (dist <= 18) {
          socket.emit('moveToken', { tokenIndex: tIdx, steps: currentLastResultSteps });
          canMoveToken = false;
          break;
        }
      }
    });

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const startX = 20, startY = 20, size = 320;

      // 외곽 사각형 및 대각선
      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.strokeRect(startX, startY, size, size);
      ctx.moveTo(startX, startY); ctx.lineTo(startX + size, startY + size);
      ctx.moveTo(startX + size, startY); ctx.lineTo(startX, startY + size);
      ctx.stroke();

      // 주요 거점 점 강조 (4개 모서리 및 중앙)
      const bigPoints = [5, 10, 15, 1, 22];

      for (let i = 1; i <= 28; i++) {
        const pt = boardCoords[i];
        const isBig = bigPoints.includes(i);

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isBig ? 13 : 8, 0, Math.PI * 2);
        ctx.fillStyle = isBig ? '#e67e22' : '#f39c12';
        ctx.fill();
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // 대기 구역
      ctx.fillStyle = '#eaeaea';
      ctx.fillRect(10, 380, 340, 50);
      ctx.fillStyle = '#555';
      ctx.font = '12px sans-serif';
      ctx.fillText('대기 중인 말 (클릭하여 출발)', 20, 395);

      // 플레이어 말 그리기
      playersData.forEach((player, pIdx) => {
        const pTokens = tokensData[player.id] || [0, 0, 0, 0];
        const color = playerColors[pIdx % 4];

        pTokens.forEach((pos, tIdx) => {
          let x = 0, y = 0;

          if (pos === 0) {
            x = 50 + tIdx * 35;
            y = 412;
          } else if (pos <= 28) {
            const coord = boardCoords[pos];
            x = coord.x + (tIdx * 3 - 4.5);
            y = coord.y + (pIdx * 3 - 4.5);
          } else {
            return;
          }

          ctx.beginPath();
          ctx.arc(x, y, 9, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#fff';
          ctx.stroke();

          if (player.id === myId && canMoveToken) {
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        });
      });
    }

    function updateUI(players, currentTurn) {
      document.getElementById('player-count').innerText = players.length;
      const listDiv = document.getElementById('players');
      listDiv.innerHTML = '';

      players.forEach((p) => {
        const isMe = p.id === myId ? ' (나)' : '';
        const item = document.createElement('div');
        if (currentTurn && p.id === currentTurn.id) item.className = 'active-turn';
        item.innerText = `${p.number}번. ${p.nickname}${isMe}`;
        listDiv.appendChild(item);
      });

      if (currentTurn) {
        const throwBtn = document.getElementById('throw-btn');
        const isMyTurn = currentTurn.id === myId;
        throwBtn.disabled = !isMyTurn || canMoveToken;
        throwBtn.innerText = isMyTurn ? '내 턴! 윷 던지기' : `${currentTurn.nickname} 턴 대기 중...`;
      }
    }
  </script>
</body>
</html>

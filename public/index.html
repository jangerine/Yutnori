<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 윷놀이</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    button { padding: 12px 24px; font-size: 18px; border: none; background-color: #4CAF50; color: white; border-radius: 6px; cursor: pointer; }
    button:hover { background-color: #45a049; }
    #result { font-size: 32px; font-weight: bold; margin-top: 20px; color: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎲 윷놀이 던지기</h1>
    <button onclick="throwYut()">윷 던지기</button>
    <div id="result">윷을 던져주세요!</div>
  </div>

  <script>
    function throwYut() {
      const outcomes = ['도', '개', '걸', '윷', '모'];
      const weights = [1, 3, 3, 1, 1]; // 확률 가중치
      const expanded = [];
      outcomes.forEach((val, idx) => {
        for (let i = 0; i < weights[idx]; i++) expanded.push(val);
      });
      const result = expanded[Math.floor(Math.random() * expanded.length)];
      document.getElementById('result').innerText = `결과: ${result}!`;
    }
  </script>
</body>
</html>

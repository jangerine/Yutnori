<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 윷놀이 (2~4인용)</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
    .card { background: white; max-width: 500px; margin: 0 auto 20px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, button, select { padding: 10px 15px; font-size: 16px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    select { background-color: #fff; font-weight: bold; cursor: pointer; }
    #board-canvas { background: #fdf8ec; border: 3px solid #8b5a2b; border-radius: 12px; margin: 10px 0; cursor: pointer; }
    #result-box { font-size: 18px; font-weight: bold; margin: 10px 0; color: #333; min-height: 30px; }
    .player-list { text-align: left; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; }
    .active-turn { font-weight: bold; color: #007bff; }
    #game-area { display: none; }

    #yut-3d-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      backdrop-filter: blur(4px);
    }
    #yut-3d-container {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #f3e5ab 0%, #c8b282 100%);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.2);
      overflow: hidden;
      border: 4px solid #8b5a2b;
    }
    #yut-3d-text {
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      text-shadow: 0 3px 6px rgba(0,0,0,0.8);
      letter-spacing: 1px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="yut-3d-modal">
    <div id="yut-3d-container"></div>
    <div id="yut-3d-text">윷 던지는 중...</div>
  </div>

  <div class="card" id="login-area">
    <h2>🎲 실시간 윷놀이 (3D)</h2>
    <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="8"><br>
    <input type="text" id="room-id" placeholder="방 코드 입력"><br>
    <button onclick="joinRoom()">입장하기</button>
  </div>

  <div class="card" id="game-area">
    <h3 id="room-title">방 코드: </h3>
    
    <div class="player-list">
      <div>참여 인원 (<span id="player-count">0</span>/4)</div>
      <div id="players"></div>
    </div>

    <canvas id="board-canvas" width="360" height="430"></canvas>

    <div id="result-box">대기 중...</div>

    <div id="controls">
      <button id="start-btn" onclick="startGame()">게임 시작 (2인 이상)</button>
      
      <div id="throw-controls" style="display:none;">
        <select id="throw-style">
          <option value="normal">🎯 정석 던지기</option>
          <option value="high">🚀 높이 던지기 (고공 점프)</option>
          <option value="spin">🌀 회전 던지기 (초고속 스핀)</option>
          <option value="gentle">🍃 살살 던지기 (낮고 묵직하게)</option>
        </select>
        <button id="throw-btn" onclick="throwYut()">윷 던지기!</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = null;
    let currentLastResultSteps = 0;
    let isYutOrMoResult = false;
    let canMoveToken = false;
    let selectedTokenIndex = null;
    let targetBoardPos = null;
    let playersData = [];
    let tokensData = {};

    const canvas = document.getElementById('board-canvas');
    const ctx = canvas.getContext('2d');

    const S = 30;
    const L = 300;
    const step = L / 5;
    const center = S + L / 2;

    const boardCoords = [
      { x: 0, y: 0 },
      { x: S + L, y: S + L - step * 1 },
      { x: S + L, y: S + L - step * 2 },
      { x: S + L, y: S + L - step * 3 },
      { x: S + L, y: S + L - step * 4 },
      { x: S + L,          y: S },
      { x: S + L - step * 1, y: S },
      { x: S + L - step * 2, y: S },
      { x: S + L - step * 3, y: S },
      { x: S + L - step * 4, y: S },
      { x: S, y: S },
      { x: S, y: S + step * 1 },
      { x: S, y: S + step * 2 },
      { x: S, y: S + step * 3 },
      { x: S, y: S + step * 4 },
      { x: S,            y: S + L },
      { x: S + step * 1, y: S + L },
      { x: S + step * 2, y: S + L },
      { x: S + step * 3, y: S + L },
      { x: S + step * 4, y: S + L },
      { x: S + L - step * 1,   y: S + step * 1 },
      { x: S + L - step * 1.8, y: S + step * 1.8 },
      { x: center, y: center },
      { x: S + step * 1.8,     y: S + L - step * 1.8 },
      { x: S + step * 1,       y: S + L - step * 1 },
      { x: S + step * 1,       y: S + step * 1 },
      { x: S + step * 1.8,     y: S + step * 1.8 },
      { x: S + L - step * 1.8, y: S + L - step * 1.8 },
      { x: S + L - step * 1,   y: S + L - step * 1 }
    ];

    const playerColors = { 1: '#e74c3c', 2: '#3498db', 3: '#2ecc71', 4: '#f1c40f' };

    // --- 3D 윷 시스템 ---
    let yutScene, yutCamera, yutRenderer;
    let yutSticks = [];
    const stickPosX = [-1.8, -0.6, 0.6, 1.8];

    function createYutMesh() {
      const shape = new THREE.Shape();
      const radius = 0.38;
      
      shape.absarc(0, 0, radius, -Math.PI / 2, Math.PI / 2, false);
      shape.lineTo(0, -radius);

      const extrudeSettings = {
        depth: 2.8,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.04,
        bevelThickness: 0.04
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();

      const woodMaterial = new THREE.MeshStandardMaterial({
        color: 0xc48546,
        roughness: 0.4,
        metalness: 0.05
      });

      const mesh = new THREE.Mesh(geometry, woodMaterial);
      return mesh;
    }

    function init3DYut() {
      const container = document.getElementById('yut-3d-container');
      yutScene = new THREE.Scene();

      // Y축 위에서 아래로 내려다보는 시점 설정
      yutCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      yutCamera.position.set(0, 6.5, 3.5);
      yutCamera.lookAt(0, 0, 0);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
      mainLight.position.set(0, 10, 5);
      yutScene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0xffd1a4, 0.5);
      fillLight.position.set(-5, 5, -5);
      yutScene.add(fillLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      yutScene.add(ambientLight);

      yutRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      yutRenderer.setSize(340, 340);
      yutRenderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(yutRenderer.domElement);

      for (let i = 0; i < 4; i++) {
        const yut = createYutMesh();
        yut.position.x = stickPosX[i];
        yutScene.add(yut);
        yutSticks.push(yut);
      }
    }
    init3DYut();

    function animate3DYut(result, style, callback) {
      const modal = document.getElementById('yut-3d-modal');
      const text = document.getElementById('yut-3d-text');
      modal.style.display = 'flex';

      yutRenderer.setSize(340, 340);

      const styleNames = {
        normal: '🎯 정석 던지기!',
        high: '🚀 높~이 던지기!',
        spin: '🌀 회전 던지기!',
        gentle: '🍃 살살 던지기...'
      };
      text.innerText = styleNames[style] || '윷 던지는 중...';

      const flatCountMap = { '도': 1, '개': 2, '걸': 3, '윷': 4, '모': 0 };
      const flatCount = flatCountMap[result] ?? 0;

      const isFlatTarget = [false, false, false, false];
      let assigned = 0;
      while (assigned < flatCount) {
        let idx = Math.floor(Math.random() * 4);
        if (!isFlatTarget[idx]) {
          isFlatTarget[idx] = true;
          assigned++;
        }
      }

      let jumpHeight = 2.0;
      let rotSpeedMult = 1.0;
      let duration = 1400;

      if (style === 'high') { jumpHeight = 3.2; duration = 1600; }
      else if (style === 'spin') { rotSpeedMult = 2.2; }
      else if (style === 'gentle') { jumpHeight = 1.2; rotSpeedMult = 0.6; duration = 1200; }

      const stickConfigs = yutSticks.map(() => ({
        totalRotX: (Math.floor(Math.random() * 3) + 4) * Math.PI * 2 * (Math.random() > 0.5 ? 1 : -1) * rotSpeedMult,
        totalRotY: (Math.random() - 0.5) * 0.8 * rotSpeedMult,
        offsetY: (Math.random() - 0.5) * 0.2
      }));

      let startTime = performance.now();

      function renderFrame(now) {
        let elapsed = now - startTime;
        let progress = elapsed / duration;

        if (progress > 1) progress = 1;

        yutSticks.forEach((stick, idx) => {
          const cfg = stickConfigs[idx];
          stick.position.x = stickPosX[idx];

          if (progress < 0.85) {
            let p = progress / 0.85;
            stick.position.y = Math.sin(p * Math.PI) * (jumpHeight + cfg.offsetY);

            stick.rotation.x = p * cfg.totalRotX;
            stick.rotation.y = p * cfg.totalRotY;
            stick.rotation.z = (Math.random() - 0.5) * 0.2;
          } else {
            let settleP = (progress - 0.85) / 0.15;
            let easeOut = 1 - Math.pow(1 - settleP, 3);

            stick.position.y = 0;
            stick.rotation.y *= (1 - easeOut);
            stick.rotation.z *= (1 - easeOut);

            // 탑뷰 시점에서 배(평평한 면) = -Math.PI / 2, 등(둥근 면) = Math.PI / 2
            let targetRotX = isFlatTarget[idx] ? -Math.PI / 2 : Math.PI / 2;
            stick.rotation.x = THREE.MathUtils.lerp(stick.rotation.x, targetRotX, easeOut);
          }
        });

        yutRenderer.render(yutScene, yutCamera);

        if (progress < 1) {
          requestAnimationFrame(renderFrame);
        } else {
          text.innerText = `[ ${result} ] !`;
          setTimeout(() => {
            modal.style.display = 'none';
            if (callback) callback();
          }, 800);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    socket.on('connect', () => { myId = socket.id; });

    function joinRoom() {
      const nickname = document.getElementById('nickname').value.trim();
      const roomId = document.getElementById('room-id').value.trim();
      if (!roomId) return alert('방 코드를 입력하세요.');

      socket.emit('joinRoom', { roomId, nickname });
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      document.getElementById('room-title').innerText = `방 코드: ${roomId}`;
      drawBoard();
    }

    function startGame() { socket.emit('startGame'); }
    
    function throwYut() { 
      const style = document.getElementById('throw-style').value;
      socket.emit('throwYut', { style }); 
    }

    const yutStepMap = { '도': 1, '개': 2, '걸': 3, '윷': 4, '모': 5 };

    socket.on('roomState', ({ players, currentTurn, gameStarted, tokens }) => {
      playersData = players;
      tokensData = tokens;
      updateUI(players, currentTurn);
      drawBoard();
    });

    socket.on('gameStarted', ({ players, currentTurn, tokens }) => {
      playersData = players;
      tokensData = tokens;
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('throw-controls').style.display = 'inline-block';
      document.getElementById('result-box').innerText = '게임을 시작합니다!';
      updateUI(players, currentTurn);
      drawBoard();
    });

    socket.on('yutResult', ({ player, result, style }) => {
      animate3DYut(result, style || 'normal', () => {
        isYutOrMoResult = (result === '윷' || result === '모');
        let extraText = isYutOrMoResult ? ' 🎉 [한 번 더 던지기 획득!]' : '';
        
        document.getElementById('result-box').innerText = `${player.nickname}: [ ${result} ]!${extraText} 말을 고르세요.`;
        currentLastResultSteps = yutStepMap[result];
        selectedTokenIndex = null;
        targetBoardPos = null;

        if (player.id === myId) {
          canMoveToken = true;
          document.getElementById('throw-btn').disabled = true;
          document.getElementById('throw-style').disabled = true;
        }
      });
    });

    socket.on('tokenMoved', ({ tokens, nextTurn, caughtOpponent, hasExtraTurn }) => {
      tokensData = tokens;
      canMoveToken = false;
      selectedTokenIndex = null;
      targetBoardPos = null;

      let msg = '';
      if (caughtOpponent) {
        msg = '💥 상대 말을 잡았습니다! [한 번 더 던질 기회!]';
      } else if (hasExtraTurn) {
        msg = '✨ 한 번 더 던질 기회가 남았습니다!';
      } else {
        msg = `${nextTurn.nickname} 님의 턴입니다.`;
      }
      document.getElementById('result-box').innerText = msg;

      updateUI(playersData, nextTurn);
      drawBoard();
    });

    function calculateTargetPos(currentPos, steps) {
      if (currentPos === 0) return steps;
      if (currentPos === 5) return 19 + steps;
      if (currentPos === 10) return 24 + steps;
      if (currentPos === 22) {
        let pos = 26 + steps;
        return pos > 28 ? 19 + (pos - 28) : pos;
      }

      let pos = currentPos;
      for (let i = 0; i < steps; i++) {
        if (pos === 19) { pos = 14; continue; }
        if (pos === 24) { pos = 14; continue; }
        if (pos === 28) { pos = 19; continue; }
        pos++;
      }

      if (pos > 28) return 30;
      return pos;
    }

    canvas.addEventListener('click', (e) => {
      if (!canMoveToken) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const myTokens = tokensData[myId] || [0, 0, 0, 0];

      if (selectedTokenIndex === null) {
        for (let tIdx = 0; tIdx < myTokens.length; tIdx++) {
          const pos = myTokens[tIdx];
          let tokenPos = (pos === 0) ? { x: 50 + tIdx * 35, y: 395 } : (pos < boardCoords.length ? boardCoords[pos] : null);

          if (tokenPos && Math.hypot(mouseX - tokenPos.x, mouseY - tokenPos.y) <= 18) {
            selectedTokenIndex = tIdx;
            targetBoardPos = calculateTargetPos(pos, currentLastResultSteps);
            document.getElementById('result-box').innerText = '도착할 칸(초록색 점)을 클릭하세요!';
            drawBoard();
            return;
          }
        }
      } else {
        if (targetBoardPos !== null && targetBoardPos < boardCoords.length) {
          const targetCoord = boardCoords[targetBoardPos];
          if (Math.hypot(mouseX - targetCoord.x, mouseY - targetCoord.y) <= 20) {
            socket.emit('moveToken', {
              tokenIndex: selectedTokenIndex,
              steps: currentLastResultSteps,
              isYutOrMo: isYutOrMoResult
            });
            canMoveToken = false;
            return;
          }
        }

        selectedTokenIndex = null;
        targetBoardPos = null;
        drawBoard();
      }
    });

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.strokeRect(S, S, L, L);
      ctx.moveTo(S, S); ctx.lineTo(S + L, S + L);
      ctx.moveTo(S + L, S); ctx.lineTo(S, S + L);
      ctx.stroke();

      const bigPoints = [5, 10, 15, 22];

      for (let i = 1; i < boardCoords.length; i++) {
        const pt = boardCoords[i];
        const isBig = bigPoints.includes(i);
        const isTarget = (i === targetBoardPos);

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isTarget ? 15 : (isBig ? 12 : 8), 0, Math.PI * 2);
        ctx.fillStyle = isTarget ? '#2ecc71' : (isBig ? '#e67e22' : '#f39c12');
        ctx.fill();
        ctx.strokeStyle = isTarget ? '#27ae60' : '#5d4037';
        ctx.lineWidth = isTarget ? 3.5 : 2;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(S + L, S + L, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#e67e22';
      ctx.fill();
      ctx.strokeStyle = '#5d4037';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#eaeaea';
      ctx.fillRect(10, 360, 340, 55);
      ctx.fillStyle = '#555';
      ctx.font = '12px sans-serif';
      ctx.fillText('대기 중인 말 (클릭하여 선택)', 20, 375);

      playersData.forEach((player) => {
        const pTokens = tokensData[player.id] || [0, 0, 0, 0];
        const color = playerColors[player.number] || '#e74c3c';

        const posCounts = {};
        pTokens.forEach(p => {
          if (p > 0 && p < 30) posCounts[p] = (posCounts[p] || 0) + 1;
        });

        pTokens.forEach((pos, tIdx) => {
          let x = 0, y = 0;

          if (pos === 0) {
            if (player.id === myId) { x = 50 + tIdx * 35; y = 395; } 
            else return;
          } else if (pos < boardCoords.length) {
            const coord = boardCoords[pos];
            x = coord.x; y = coord.y;
          } else return;

          const isSelected = (player.id === myId && tIdx === selectedTokenIndex);

          ctx.beginPath();
          ctx.arc(x, y, isSelected ? 11 : 9, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#fff';
          ctx.stroke();

          if (pos > 0 && pos < 30 && posCounts[pos] > 1) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${posCounts[pos]}`, x, y);
          }

          if (isSelected) {
            ctx.beginPath();
            ctx.arc(x, y, 14, 0, Math.PI * 2);
            ctx.strokeStyle = '#007bff';
            ctx.lineWidth = 3;
            ctx.stroke();
          } else if (player.id === myId && canMoveToken && selectedTokenIndex === null) {
            ctx.beginPath();
            ctx.arc(x, y, 13, 0, Math.PI * 2);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        });
      });
    }

    function updateUI(players, currentTurn) {
      document.getElementById('player-count').innerText = players.length;
      const listDiv = document.getElementById('players');
      listDiv.innerHTML = '';

      players.forEach((p) => {
        const isMe = p.id === myId ? ' (나)' : '';
        const color = playerColors[p.number] || '#333';
        const item = document.createElement('div');
        if (currentTurn && p.id === currentTurn.id) item.className = 'active-turn';
        
        item.innerHTML = `<span style="color:${color}; font-weight:bold;">●</span> ${p.number}번. ${p.nickname}${isMe}`;
        listDiv.appendChild(item);
      });

      if (currentTurn) {
        const throwBtn = document.getElementById('throw-btn');
        const throwStyle = document.getElementById('throw-style');
        const isMyTurn = currentTurn.id === myId;
        
        throwBtn.disabled = !isMyTurn || canMoveToken;
        throwStyle.disabled = !isMyTurn || canMoveToken;
        
        throwBtn.innerText = isMyTurn ? '내 턴! 윷 던지기' : `${currentTurn.nickname} 턴 대기 중...`;
      }
    }
  </script>
</body>
</html>

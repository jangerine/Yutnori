<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 멀티 윷놀이 (2~4인)</title>
  <style>
    body { font-family: 'Arial', sans-serif; text-align: center; background: #eef2f3; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 6px; background: #3498db; color: white; }
    button:hover { background: #2980b9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #board { width: 400px; height: 400px; border: 4px solid #333; margin: 20px auto; position: relative; background: #fdf6e3; border-radius: 8px; }
    .player-list { display: flex; justify-content: space-around; margin-top: 15px; }
    .player-card { padding: 10px 15px; border-radius: 8px; color: white; font-weight: bold; }
    #log { margin-top: 15px; font-size: 18px; font-weight: bold; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 온라인 멀티 윷놀이 (2~4인)</h1>

    <!-- 대기실 영역 -->
    <div id="lobby">
      <input type="text" id="username" placeholder="닉네임 입력" style="padding: 10px; font-size: 16px;">
      <button onclick="joinGame()">참가하기</button>
      <p id="player-count">현재 참가자: 0 / 4 (최소 2명 필요)</p>
      <button id="start-btn" onclick="startGame()" disabled>게임 시작</button>
    </div>

    <!-- 게임 플레이 영역 -->
    <div id="game-area" class="hidden">
      <div id="turn-info" style="font-size: 20px; font-weight: bold; margin-bottom: 10px;"></div>
      
      <div id="board">
        <p style="padding-top: 180px; color: #888;">[ 윷놀이 판 영역 ]</p>
      </div>

      <div>
        <button onclick="rollYut()">윷 던지기</button>
      </div>

      <div id="log">게임이 준비되었습니다.</div>
      <div class="player-list" id="players-display"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
